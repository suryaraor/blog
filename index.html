---
layout: default
---
<!-- Blog index page for posts under /blog/_posts -->
<h1 style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', 'Noto Sans', sans-serif; font-size: 2.6rem; font-weight: 500; letter-spacing: 0.01em; color: #111; margin-bottom: 2.2rem;">My Blog Posts</h1>
<ul>
  {% for post in site.posts %}
    <li>
      <div class="blog-title"><a class="blog-link" href="{{ post.url }}">{{ post.title }}</a></div>
      <div class="blog-meta">{{ post.date | date: "%B %d, %Y" }}</div>
    </li>
  {% endfor %}
</ul>
{% if site.posts == empty %}
  <div class="no-posts">No blog posts found.</div>
{% endif %}
<!-- Navigation links removed to avoid duplication; handled by layout -->
