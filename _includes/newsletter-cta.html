<section class="newsletter-cta" aria-label="Newsletter signup">
    <div class="newsletter-cta-inner">
        <p class="newsletter-cta-icon">&#128139;</p>
        <div class="newsletter-cta-text">
            <h2 class="newsletter-cta-title">Enjoyed this? Get the next one.</h2>
            <p class="newsletter-cta-desc">No-nonsense essays on engineering, systems thinking, and the hidden costs of "best practices" — straight to your inbox.</p>
        </div>
        <form class="newsletter-form"
              action="https://buttondown.email/api/emails/embed-subscribe/suryarao"
              method="post"
              target="popupwindow"
              onsubmit="window.open('https://buttondown.email/suryarao','popupwindow')">
            <input type="hidden" value="1" name="embed">
            <div class="newsletter-form-row">
                <label for="newsletter-email" class="sr-only">Email address</label>
                <input class="newsletter-input" id="newsletter-email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
                <button class="newsletter-submit" type="submit">Subscribe</button>
            </div>
            <p class="newsletter-disclaimer">No spam. Unsubscribe any time.</p>
        </form>
    </div>
</section>
