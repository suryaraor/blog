{% if page.further_reading %}
<section class="further-reading">
    <h2 class="further-reading-title">&#128218; Further Reading</h2>
    <div class="further-reading-grid">
        {% for item in page.further_reading %}
        <a class="further-reading-card" href="{{ item.url }}" target="_blank" rel="noopener noreferrer">
            <span class="further-reading-card-title">{{ item.title }}</span>
            {% if item.desc %}
            <span class="further-reading-card-desc">{{ item.desc }}</span>
            {% endif %}
            <span class="further-reading-card-link">Read &rarr;</span>
        </a>
        {% endfor %}
    </div>
</section>
{% endif %}
