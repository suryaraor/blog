{% if site.giscus.repo %}
<section class="giscus-comments" aria-label="Comments">
    <h2 class="giscus-comments-title">Discussion</h2>
    <script src="https://giscus.app/client.js"
            data-repo="{{ site.giscus.repo }}"
            data-repo-id="{{ site.giscus.repo_id }}"
            data-category="{{ site.giscus.category | default: 'General' }}"
            data-category-id="{{ site.giscus.category_id }}"
            data-mapping="{{ site.giscus.mapping | default: 'pathname' }}"
            data-strict="0"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="bottom"
            data-theme="preferred_color_scheme"
            data-lang="en"
            crossorigin="anonymous"
            async>
    </script>
    <noscript>Please enable JavaScript to view comments powered by <a href="https://giscus.app">Giscus</a>.</noscript>
</section>
{% endif %}
