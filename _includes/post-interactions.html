{% assign post_id = include.post_id | default: page.url %}
{% assign api_url = include.api_url | default: site.comments_api_url %}

<section class="post-comments" data-post-id="{{ post_id | escape }}" data-api-url="{{ api_url | escape }}">
  <h2 class="post-comments__heading">Comments</h2>

  <ol class="comment-list" data-comment-list></ol>

  <form class="comment-form" data-comment-form novalidate>
    <label>
      <span>Name</span>
      <input type="text" name="name" maxlength="80" autocomplete="name" required placeholder="Your name">
    </label>

    <label>
      <span>Comment</span>
      <textarea name="comment" maxlength="2000" rows="4" required placeholder="Share your thoughts…"></textarea>
    </label>

    <label class="comment-form__honeypot" aria-hidden="true">
      <span>Leave this field blank</span>
      <input type="text" name="company" tabindex="-1" autocomplete="off" maxlength="100">
    </label>

    <input type="hidden" name="post_id" value="{{ post_id | escape }}">
    <input type="hidden" name="page_url" value="{{ page.url | escape }}">
    <input type="hidden" name="post_title" value="{{ page.title | escape }}">

    <div class="comment-form__actions">
      <button type="submit" data-comment-submit>Post comment</button>
      <span class="comment-form__status" data-status role="status" aria-live="polite"></span>
    </div>
  </form>
</section>
