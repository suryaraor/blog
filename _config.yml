title: "Surya Rao Rayarao Blog"
description: "Code, Karma, and Creativity: A deeper look at tech's impact on our world"
author: "Surya Rao Rayarao"
email: "hello@example.com"
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
collections:
  unlisted:
    output: true
    permalink: /unlisted/:name/
  reverted:
    output: true
    permalink: /reverted/:name/
defaults:
  - scope:
      path: ""
      type: unlisted
    values:
      sitemap: false
      robots: "noindex, nofollow"
  - scope:
      path: ""
      type: reverted
    values:
      sitemap: false
      robots: "noindex, nofollow"
google_analytics: G-6W38HK15G9

# Plausible Analytics (privacy-friendly, no cookies)
# Register at plausible.io and add your site domain here.
plausible_domain: "suryaraor.github.io"

plugins:
  - jekyll-feed
  - jekyll-sitemap

# Giscus (GitHub Discussions) comments — fill in repo_id and category_id
# from https://giscus.app after enabling Discussions on the repo.
giscus:
  repo: "suryaraor/blog"
  repo_id: "R_kgDONxample"
  category: "General"
  category_id: "DIC_kwDONxample"
  mapping: "pathname"

# Google Apps Script web app URL for comments and likes.
# Set this after deploying the Apps Script backend.
comments_api_url: "https://script.google.com/macros/s/AKfycbwn1KvY4zRu9v7ujWzJTdCFxSYHy5teZw0nCe5ihjJG1fNcnwqqdKDyGvzQnZd13IFH/exec"