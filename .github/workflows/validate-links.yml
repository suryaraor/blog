name: Validate Internal Links

on:
  push:
    branches: [main, gh-pages]
    paths:
      - '_posts/**'
      - 'scripts/validate_internal_links.py'
      - 'scripts/requirements.txt'
  pull_request:
    branches: [main, gh-pages]
    paths:
      - '_posts/**'

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Get changed posts
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '^_posts/.*\.md$' | tr '\n' ' ' || true)
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            FILES=$(git show --name-only --format='' HEAD | grep '^_posts/.*\.md$' | tr '\n' ' ' || true)
          else
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '^_posts/.*\.md$' | tr '\n' ' ' || true)
          fi
          echo "posts=$FILES" >> $GITHUB_OUTPUT

      - name: Validate internal links
        env:
          CHANGED_POSTS: ${{ steps.diff.outputs.posts }}
        run: |
          if [ -z "$CHANGED_POSTS" ]; then
            echo "No post files changed — skipping link validation"
          else
            echo "Validating: $CHANGED_POSTS"
            python scripts/validate_internal_links.py $CHANGED_POSTS
          fi
