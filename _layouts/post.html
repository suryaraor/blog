---
layout: default
---

<article>
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
            <time datetime="{{ page.date | date_to_xmlschema }}">
                {{ page.date | date: "%B %d, %Y" }}
            </time>
            {% if page.author %} • by {{ page.author }}{% endif %}
        </div>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
